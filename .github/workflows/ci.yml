name: canon

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Runtime binary probe
        run: |
          cargo run --quiet --bin logline -- --version
          cargo run --quiet --bin logline -- status
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify spec files parse
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in Path("spec").glob("*.v0"):
              text = path.read_text()
              if len(text.strip()) == 0:
                  raise SystemExit(f"EMPTY: {path}")
              print(f"OK {path} ({len(text)} bytes)")

          for path in Path("source").glob("*.logline"):
              text = path.read_text()
              if len(text.strip()) == 0:
                  raise SystemExit(f"EMPTY: {path}")
              print(f"OK {path} ({len(text)} bytes)")
          PY
      - name: Runtime source audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          forbidden = ("unsafe {",)
          warn_in_non_test = ("unwrap(", "expect(", "panic!")
          failures = []

          for path in Path("crates").rglob("*.rs"):
              text = path.read_text()
              is_test = "/tests/" in str(path) or path.name.endswith("_test.rs")
              for needle in forbidden:
                  if needle in text:
                      failures.append(f"{path}: contains {needle}")
              if not is_test:
                  for needle in warn_in_non_test:
                      if needle in text:
                          print(f"WARN {path}: contains {needle}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
